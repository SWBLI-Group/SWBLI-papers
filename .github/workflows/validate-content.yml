name: validate-content

on:
  # Run on every PR: a required check that is skipped by path filters would
  # remain pending and block merging.
  pull_request:
  push:
    branches: [new, main]
    paths:
      - "papers/**"
      - "assets/data.js"
      - "pdfs/library_hashes.json"
      - "tools/validate_content.py"
      - "tools/update_pdf_hashes.py"
      - ".github/workflows/validate-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JS syntax
        run: |
          node --check assets/data.js
          node --check assets/app.js

      - name: Validate paper ids and data consistency
        run: |
          strict=1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if ! echo "$files" | grep -q '^assets/data\.js$'; then
              # A member PR may add papers/<slug>.html before the admin updates
              # assets/data.js. Orphan pages are warnings in this mode; duplicate
              # ids, duplicate page data-pid and missing pages are still errors.
              strict=0
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # A page-only merge into new is expected to be temporarily orphaned
            # until the admin's data.js update. The data.js push is strict.
            files=$(git diff "${{ github.event.before }}"...HEAD --name-only 2>/dev/null || true)
            if ! echo "$files" | grep -q '^assets/data\.js$'; then
              strict=0
            fi
          fi
          if [ "$strict" = "1" ]; then
            python tools/validate_content.py --skip-pdf-files
          else
            python tools/validate_content.py --allow-orphan-pages --skip-pdf-files
          fi
