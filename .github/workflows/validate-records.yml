name: validate-records

on:
  pull_request:
    paths:
      - "records/**"
      - "schemas/**"
      - "build/**"
      - "assets/app.js"
      - "CONTRIBUTING.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "records/**"
      - "schemas/**"
      - "build/**"
      - "assets/app.js"
      - "CONTRIBUTING.md"
      - "README.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate contribution records
        run: python build/validate_records.py
      - name: Check Python syntax
        run: python -m py_compile build/build_site.py build/validate_records.py
      - name: Check frontend syntax
        run: node --check assets/app.js
